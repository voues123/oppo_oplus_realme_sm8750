name: OP13 SukiSU SUSFS 2.3 KPM AK3
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118'
  KERNEL_NAME: android15-8-g93e223c276e7-abogki500782043-4k
  CCACHE_KEY: ccache-sukisu-builtin-susfs230-6.6.118
  SUKISU_COMMIT: 1cfa57340590971cba7521ed536da8ebbedc5f0a
  KERNEL_SOURCE_COMMIT: 2a4726b11594dd57d0779d2685fad5c81e5ed553
  KSU_BUILD_REF: builtin-susfs
  KSU_VERSION: '41150'
  KSU_VERSION_FULL: v4.3.0-r2-1cfa5734@builtin-susfs
  SUSFS_COMMIT: 70ef05071dfc423da158543a79e6cbc805809345
'on':
  push:
    branches:
    - codex/op13-sukisu-susfs-kpm-20261108
  workflow_dispatch: {}
jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
    - name: 安装环境依赖+初始化源码仓库及llvm-Clang18工具链
      run: "rm -rf kernel_workspace\nmkdir kernel_workspace\ncd kernel_workspace\necho \"当前仓库：$GITHUB_REPOSITORY\"\necho \"当前分支：$GITHUB_REF_NAME\"\n\nsudo\
        \ apt-mark hold firefox &&\nsudo apt-mark hold libc-bin &&\nsudo apt purge man-db &&\nsudo rm -rf /var/lib/man-db/auto-update &&\nsudo apt update\
        \ &&\nsudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev rsync &\n#旧版完整指令：（由于经过验证大部分指令已内置于GitHub Action环境中，故进行精简）\n\
        #sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev zip\
        \ unzip ccache\n\n#使用最新版ccache-ECS（特化优化内核编译缓存，大幅提升二次不同配置编译速度）\nwget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64\
        \ -O ccache &&\nsudo cp -f ./ccache /usr/bin/ccache &&\nsudo chmod +x /usr/bin/ccache &&\nrm -f ./ccache &\n\necho \"正在克隆源码仓库...\"\naria2c -s16\
        \ -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/2a4726b11594dd57d0779d2685fad5c81e5ed553.zip -o common.zip &&\
        \ \nunzip -q common.zip && \nmv \"android_kernel_common_oneplus_sm8750-2a4726b11594dd57d0779d2685fad5c81e5ed553\" common &&\nrm -rf common.zip &\n\
        \necho \"正在克隆llvm-clang18工具链...\" &&\nmkdir -p clang18 &&\naria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip\
        \ -o clang.zip &&\nunzip -q clang.zip -d clang18 &&\nrm -rf clang.zip &\n\necho \"正在克隆构建工具...\" &&\naria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip\
        \ -o build-tools.zip &&\nunzip -q build-tools.zip &&\nrm -rf build-tools.zip &\n\nwait\necho \"所有源码及llvm-Clang18工具链初始化完成！\"\necho \"正在去除 ABI 保护\
        \ & 去除 dirty 后缀...\"\nrm common/android/abi_gki_protected_exports_* || true\nfor f in common/scripts/setlocalversion; do\n  sed -i 's/ -dirty//g'\
        \ \"$f\"\n  sed -i '$i res=$(echo \"$res\" | sed '\\''s/-dirty//g'\\'')' \"$f\"\ndone\n"
    - name: 配置ccache目录
      run: |
        echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
        echo "当前磁盘空间："
        df -h
        echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
        if [[ "false" != "false" ]]; then
          CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
        else
          CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
        fi
        echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV
    - name: 载入当前版本内核的 ccache缓存
      uses: actions/cache@v5
      id: ccache-restore
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: |
          ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
          ${{ env.CCACHE_REAL_KEY }}-
    - name: 拉取公共预置 ccache 缓存
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "检查本地缓存状态..."
        if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
          echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
          exit 0
        fi

        echo "未命中缓存，尝试拉取最新公共 ccache ..."
        mkdir -p ${{ env.CCACHE_DIR }}
        if [[ "false" != "false" ]]; then
          FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
        else
          FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
        fi

        if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
          echo "成功下载 $FILE_NAME，正在解压..."
          tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
          echo "公共 ccache 恢复完成！"
        else
          echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
        fi
    - name: 清除旧 ccache 缓存
      if: 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "正在清除仓库中的旧 ccache 缓存..."
        if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
          echo "成功删除旧的 ccache 缓存！"
        else
          echo "旧缓存不存在或已被清理！"
        fi
    - name: 初始化并配置ccache
      run: |
        # 设置ccache环境变量
        export CCACHE_COMPILERCHECK="none"
        export CCACHE_BASEDIR="${{ github.workspace }}"
        export CCACHE_NOHASHDIR="true"
        export CCACHE_NOHARDLINK="true"
        export CCACHE_DIR="${{ env.CCACHE_DIR }}"
        export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"

        # 确保ccache目录存在
        mkdir -p "$CCACHE_DIR"

        # 每次运行都重新配置缓存大小
        echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
        ccache -M "$CCACHE_MAXSIZE"
        ccache -o compression=true

        # 显示初始缓存状态
        echo "ccache初始状态:"
        ccache -s

        # 如果缓存恢复命中，显示详细信息
        if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
          echo "ccache缓存命中详情:"
          ccache -sv
        fi
    - name: 集成官方 SukiSU builtin 与 SUSFS
      id: ksu_version
      run: |
        set -euo pipefail
        cd kernel_workspace
        git clone --filter=blob:none https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
        git -C KernelSU checkout --detach 1cfa57340590971cba7521ed536da8ebbedc5f0a
        test "$(git -C KernelSU rev-parse HEAD)" = "1cfa57340590971cba7521ed536da8ebbedc5f0a"
        echo "SUKISU_SOURCE_COMMIT=$(git -C KernelSU rev-parse HEAD)"
        test ! -e common/drivers/kernelsu
        ln -s ../../KernelSU/kernel common/drivers/kernelsu
        grep -q 'CONFIG_KSU.*kernelsu/' common/drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
        grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig || printf '\nsource "drivers/kernelsu/Kconfig"\n' >> common/drivers/Kconfig
        git clone --filter=blob:none https://github.com/cctv18/susfs4oki.git -b oki-android15-6.6 susfs4oki
        git -C susfs4oki checkout --detach 70ef05071dfc423da158543a79e6cbc805809345
        test "$(git -C susfs4oki rev-parse HEAD)" = "70ef05071dfc423da158543a79e6cbc805809345"
        cp susfs4oki/kernel_patches/fs/susfs.c common/fs/
        cp susfs4oki/kernel_patches/include/linux/susfs*.h common/include/linux/
        cd common
        curl -fL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/custom_patch/susfs230_6.6.118.patch" -o susfs-kernel.patch
        echo '5c2c53b142e91d7d6a46859f6c1ac3c65e7ee90010acf06a4b2b635b6730ee36  susfs-kernel.patch' | sha256sum -c -
        git apply --verbose --whitespace=nowarn susfs-kernel.patch
        curl -fL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/custom_patch/sukisu-susfs-selinux-compat.c" -o susfs-selinux-compat.c
        echo 'ee3c9b9b8d20434f59f687fbc2511107cc94751f2bcc1146c816caf3c675b990  susfs-selinux-compat.c' | sha256sum -c -
        curl -fL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/tools/inject_susfs_selinux_compat.py" -o inject_susfs_selinux_compat.py
        echo '41d28a638ce2b87f0d981c0d1a48a398e6dff5c4f6f7163b0286be9850530861  inject_susfs_selinux_compat.py' | sha256sum -c -
        python3 inject_susfs_selinux_compat.py susfs.c susfs-selinux-compat.c
        test -z "$(find fs include kernel security drivers -name '*.rej' -print -quit)"
        grep -q 'susfs_is_priority_uid_filtered' fs/susfs.c
        grep -q 'int susfs_add_sus_type' fs/susfs.c
        grep -q 'int susfs_add_sus_avd_allowed_by_type' fs/susfs.c
        grep -q 'CMD_SUSFS_SET_PRIORITY_UID_FILTER' include/linux/susfs_def.h
        grep -Fx '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
        grep -q '^config KSU_SUSFS$' drivers/kernelsu/Kconfig
        grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
        cd ../
        echo "KSUVER=41150" >> "$GITHUB_ENV"
        echo "ksuver=41150" >> "$GITHUB_OUTPUT"
        echo 'ROOT_SOURCE=official SukiSU builtin; manager target v4.3.0-r2; SUSFS_INLINE_HOOK; no BakaSU'
    - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
      if: 'false'
      run: |
        echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
        cd kernel_workspace
        git clone --depth=1 https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME $GITHUB_ACTOR
        cp ./$GITHUB_ACTOR/zram_patch/001-lz4.patch ./common/
        cp ./$GITHUB_ACTOR/zram_patch/lz4armv8.S ./common/lib
        cp ./$GITHUB_ACTOR/zram_patch/002-zstd.patch ./common/
        cd ./common
        git apply -p1 < 001-lz4.patch || true
        patch -p1 -F 3 < 002-zstd.patch || true
    - name: 应用 lz4kd 补丁
      if: 'false'
      run: |
        echo "正在添加lz4kd补丁…"
        cd kernel_workspace
        if [ ! -d "SukiSU_patch" ]; then
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
        fi
        cd common
        cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
        cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
        cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
        cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
        patch -p1 -F 3 < lz4kd.patch || true
    - name: 启用 SUSFS 全部功能与 KPM
      run: |
        set -euo pipefail
        cd kernel_workspace
        ./common/scripts/config --file ./common/arch/arm64/configs/gki_defconfig   -e KSU -e KPM -e KPROBES -e KRETPROBES -e HAVE_SYSCALL_TRACEPOINTS   -e EXT4_FS -e KALLSYMS -e KALLSYMS_ALL -e IKCONFIG -e IKCONFIG_PROC   -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_SIZE   -e TMPFS_XATTR -e TMPFS_POSIX_ACL -d KSU_DEBUG -d KSU_DISABLE_MANAGER -d KSU_DISABLE_POLICY
        sed -i 's/check_defconfig//' ./common/build.config.gki

        ./common/scripts/config --file ./common/arch/arm64/configs/gki_defconfig  -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT  -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SPOOF_UNAME  -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS  -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT  -e KSU_SUSFS_SUS_MAP
    - name: 启用网络功能增强优化配置
      if: 'false'
      run: |
        cd kernel_workspace
        #启用  BPF 流解析器,实现高性能网络流量处理,增强网络监控和分析能力
        echo "CONFIG_BPF_STREAM_PARSER=y" >> ./common/arch/arm64/configs/gki_defconfig
        #开启增强 Netfilter 防火墙扩展模块,支持基于地址类型的匹配规则,启用 IP 集合支持,提高防火墙规则灵活性,支持更复杂的流量过滤策略
        echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
        #启用 IP 集框架及其多种数据结构实现,提供高效的大规模 IP 地址管理,提高防火墙规则处理效率,减少内存占用
        echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
        #启用 IPv6 网络地址转换
        echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
        #由于部分机型的vintf兼容性检测规则，在开启CONFIG_IP6_NF_NAT后开机会出现"您的设备内部出现了问题。请联系您的设备制造商了解详情。"的提示，故添加一个配置修复补丁，在编译内核时隐藏CONFIG_IP6_NF_NAT=y但不影响对应功能编译
        cd common
        wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch
        patch -p1 -F 3 < config.patch || true
    - name: 添加 BBR 等一系列拥塞控制算法
      run: |
        if [[ "false" != "false" ]]; then
          echo "正在添加BBR等拥塞控制算法..."
          cd kernel_workspace
          #开启TCP拥塞控制算法控制器（必需）
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
          ################################################################################################################################
          # BBR：基于链路容量的代表拥塞控制算法，不再使用丢包、延时等信号去衡量拥塞是否发生，而是直接对网络建模来应对、避免真实的网络拥塞；
          # 具有高吞吐、低延迟、抗丢包的特点，但在手机上使用时由于持续探测带宽/RTT、高频计算与发包增加 CPU 和射频模块功耗，会增加耗电及发热；
          # 且移动基站缓冲区深度通常较小（~50ms），BBR 的带宽探测阶段（ProbeRTT）过度降窗可能导致吞吐量骤降，且网络切换（WiFi→5G）时需重新
          # 探测参数，反而增加延迟或导致速率振荡（短暂卡顿），且存在 RTT 不公平性，与基于丢包的流竞争时可能过于强势，在混合网络环境中
          #（如 BBR + CUBIC 共存），BBR 会抢占更多其他软件的带宽，降低其他应用的公平性（如后台软件更新影响前台视频播放）。
          # 因此，虽然BBR可以显著减少排队延迟，抗丢包能力强，带宽利用率高，但由于其会增加耗电，且易导致网络速率波动，故安卓系统默认不使用
          # BBR拥塞算法，而是使用在吞吐量、稳定性、兼容性、能效之间取得最佳平衡的CUBIC算法。在开启BBR前，请考虑自己是否真的有使用BBR的必要。
          ################################################################################################################################
          echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
          #CUBIC：安卓的默认TCP拥塞控制算法，在吞吐量、稳定性、兼容性、能效之间取得最佳平衡，具有高兼容性与公平性、抗网络波动性强、低计算开销的特点，是绝大部分移动场景的优先选择
          echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
          #VEGAS：基于时延的拥塞控制算法之一，将回路响应时间（Round Trip Time，RTT）增加视为出现拥塞，增加时增大拥塞窗口，减小时减小拥塞窗口
          echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
          #New Vegas：Vegas 算法的改进版，优化了 RTT 测量和竞争公平性，可以更准确地检测拥塞，与 Reno/CUBIC 共存能力提升
          echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
          #Westwood+：基于带宽估计（ACK 到达率）动态设置拥塞窗口和慢启动阈值；快速恢复，适合无线网络（区分拥塞丢包与无线丢包）
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
          #HTCP：一种基于损失的算法，使用 AIMD 来控制拥塞窗口，根据 RTT 动态调整增长因子，结合延迟和丢包信号，针对高延迟的高速网络进行优化
          echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
          #brutal：一种通过主动探测 + 激进抢占最大化吞吐量的拥塞算法，无拥塞窗口上限，轻度丢包（<20%）不降窗，避免类似 BBR 的 ProbeRTT 阶段，
          #持续维持高发送速率，与 Reno/CUBIC 共存时，Brutal 可通过高频发包抢占 90%+ 带宽，适用于高丢包弱网环境（如公共 Wi-Fi、蜂窝网络）及
          #直播推流、云游戏上行链路等需优先保证吞吐量而非延迟敏感的场景，提升弱网吞吐性能，对抗运营商 QoS 限速。但由于TCP Brutal 仅在应用程序
          #对每个 TCP 连接设置带宽参数之后才能正常工作，绝大部分安卓应用都不支持该操作，故请勿将 TCP Brutal 设置成默认拥塞控制算法。
          echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "false" == "default" ]]; then
            echo "正在将BBR设为默认拥塞控制算法..."
            echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
          fi
        fi
    - name: 启用 Droidspaces 容器支持
      run: |
        if [[ "false" != "false" ]]; then
          echo "正在启用 Droidspaces 容器支持..."
          cd kernel_workspace/common
          # 应用 Droidspaces 容器必须补丁
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch
          patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
          # 修补 oplus_bsp_midas 行为，避免开机崩溃
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch
          patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
          # 应用 NTSync 补丁
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_base.patch
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
          patch -p1 -F 3 < ntsync_base.patch || true
          patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
          # 开启 Droidspaces 容器所需内核支持
          echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
          # 未经测试的配置选项，可能导致bug
          #echo "CONFIG_CGROUP_DEVICE=y" >> ./arch/arm64/configs/gki_defconfig
          #echo "CONFIG_CGROUP_PIDS=y" >> ./arch/arm64/configs/gki_defconfig
          #echo "CONFIG_FW_LOADER_COMPRESS=y" >> ./arch/arm64/configs/gki_defconfig
          #echo "CONFIG_BRIDGE_NETFILTER=y" >> ./arch/arm64/configs/gki_defconfig
          #echo "CONFIG_NF_TABLES=y" >> ./arch/arm64/configs/gki_defconfig
          # 开启 NTSync
          echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig
          if [[ "false" == "extend" ]]; then
            echo "正在启用容器环境扩展支持..."
            # 开启虚拟 HCI 设备支持
            echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
            # 开启 systemd-coredump 支持
            echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig
            # 添加 Lindroid EVDI DRM 驱动
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/evdi_drm.patch
            patch -p1 -F 3 < evdi_drm.patch || true
            echo "CONFIG_DRM_LINDROID_EVDI=y" >> ./arch/arm64/configs/gki_defconfig
          fi
        fi
    - name: 启用ADIOS IO调度器
      if: 'true'
      run: |
        echo "正在启用ADIOS IO调度器(将截止时间优先调度算法与基于自主学习的自适应延迟控制算法相结合, 降低I/O延迟)…"
        cd kernel_workspace
        echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
        echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
    - name: 启用Re-Kernel支持
      if: 'false'
      run: |
        echo "正在启用Re-Kernel支持(用于与Freezer,NoActive等软件配合使用,提升冻结后台能力)…"
        cd kernel_workspace
        echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig
    - name: 启用内核级基带保护
      if: 'true'
      run: |
        echo "正在启用启用内核级基带保护支持…"
        cd kernel_workspace
        echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
        cd ./common
        curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
    - name: 添加制作名称
      run: "cd kernel_workspace\necho \"替换内核版本后缀...\"\nif [[ -n \"\" ]]; then\n  echo \"当前内核版本后缀：\"\n  for f in ./common/scripts/setlocalversion; do\n \
        \   sed -i \"\\$s|echo \\\"\\\\\\$res\\\"|echo \\\"-\\\"|\" \"$f\"\n  done\n  sudo sed -i 's/-4k/-/g' ./common/arch/arm64/configs/gki_defconfig\n\
        else\n  echo \"当前内核版本后缀：${{ env.KERNEL_NAME }}\"\n  for f in ./common/scripts/setlocalversion; do\n    sed -i \"\\$s|echo \\\"\\\\\\$res\\\"|echo\
        \ \\\"-${{ env.KERNEL_NAME }}\\\"|\" \"$f\"\n  done\n  sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' ./common/arch/arm64/configs/gki_defconfig\n\
        fi\nsed -i 's/${scm_version}//' ./common/scripts/setlocalversion\necho \"CONFIG_LOCALVERSION_AUTO=n\" >> ./common/arch/arm64/configs/gki_defconfig\n\
        \ \n"
    - name: 构建内核
      run: |
        WORKDIR="$(pwd)"
        export PATH="/usr/lib/ccache:$PATH"
        export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
        export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
        CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"
        CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
        LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
        echo "编译器信息:"
        echo "Clang版本: $CLANG_VERSION"
        echo "LLD版本: $LLD_VERSION"
        pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"

        export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
        export CCACHE_COMPILERCHECK="none"
        export CCACHE_BASEDIR="${{ github.workspace }}"
        export CCACHE_NOHASHDIR="true"
        export CCACHE_NOHARDLINK="true"
        export CCACHE_DIR="${{ env.CCACHE_DIR }}"
        export CCACHE_MAXSIZE="3G"
        export CCACHE_IS_KERNEL_COMPILING="true"
        echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"

        cd kernel_workspace/common
        wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so
        wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so
        chmod 777 ./*.so
        export FAKESTAT="2025-05-25 12:00:00"
        export FAKETIME="@2025-05-25 13:00:00"
        echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
        echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
        SO_DIR=$(pwd)
        export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
        #创建 CC (编译器) 包装器
        echo '#!/bin/bash' > cc-wrapper
        echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
        echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
        echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
        echo 'ccache clang "$@"' >> cc-wrapper
        #创建 LD (链接器) 包装器
        echo '#!/bin/bash' > ld-wrapper
        echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
        echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
        echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
        echo 'ld.lld "$@"' >> ld-wrapper

        # 测试时间劫持测试是否正常工作
        echo "--- [Wrapper Test] 正在创建通用的时间劫持测试脚本 ---"
        echo '#!/bin/bash' > test-wrapper.sh
        echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
        echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
        echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
        echo 'echo ">>> Wrapper 内部环境检查完毕."' >> test-wrapper.sh
        echo 'exec "$@"' >> test-wrapper.sh # 执行所有传入的参数
        chmod +x test-wrapper.sh
        echo "--- [Wrapper Test] 正在测试 (date) 命令 ---"
        ./test-wrapper.sh date
        echo "--- [Wrapper Test] 正在测试 (stat) 命令 ---"
        ./test-wrapper.sh stat ./Makefile
        echo "--- [Wrapper Test] 测试完毕 ---"
        chmod +x cc-wrapper ld-wrapper
        echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
        echo "--- 编译前环境文件时间戳: ---"
        LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

        #在构建内核的同时清除不必要的.NET, Android NDK, Haskell, CodeQL运行库，清理空间且不阻塞后续步骤运行
        sudo rm -rf /usr/share/dotnet &
        sudo rm -rf /usr/local/lib/android &
        sudo rm -rf /opt/ghc &
        sudo rm -rf /opt/hostedtoolcache/CodeQL &
        make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error KSU_VERSION=41150 KSU_VERSION_FULL=v4.3.0-r2-1cfa5734@builtin-susfs KSU_BUILD_REF=builtin-susfs gki_defconfig &&
        make -j$(nproc --all) LLVM=1 ARCH=arm64 O=out headers_install INSTALL_HDR_PATH="$(pwd)/out/usr" &&
        make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error KSU_VERSION=41150 KSU_VERSION_FULL=v4.3.0-r2-1cfa5734@builtin-susfs KSU_BUILD_REF=builtin-susfs Image

        # 编译后时间劫持二次校验
        echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
        echo "--- 编译后环境文件时间戳: ---"
        LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
        echo "内核编译完成！"
        echo "ccache状态："
        ccache -s
        echo "编译后空间:"
        df -h
    - name: 保存新的 ccache 缓存
      if: false || steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
    - name: 核验内核版本与镜像
      run: |
        set -euo pipefail
        cd kernel_workspace/common
        test -s out/arch/arm64/boot/Image
        grep -q 'Linux/arm64 6.6.118' out/.config
        for config in CONFIG_KSU=y CONFIG_KPM=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y CONFIG_KSU_SUSFS_SUS_MAP=y CONFIG_HMBIRD_SCHED=y CONFIG_KPROBES=y CONFIG_KRETPROBES=y CONFIG_MQ_IOSCHED_ADIOS=y CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y; do
          grep -Fx "$config" out/.config
        done
        strings out/arch/arm64/boot/Image > out/image-strings.txt
        grep -m1 'Linux version 6.6.118' out/image-strings.txt
        grep -Fx 'v4.3.0-r2-1cfa5734@builtin-susfs' out/image-strings.txt
        grep -Fx 'com.sukisu.ultra' out/image-strings.txt
        grep -Fx '947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef' out/image-strings.txt
        grep -E 'ksu_handle_setresuid|ksu_handle_execveat|susfs_init|sukisu_kpm_bridge|hmbird_ops_init' out/image-strings.txt
        grep -Fx 'v2.3.0' out/image-strings.txt
    - name: 应用 SukiSU 官方 KPM ABI v2
      if: 'true'
      run: |
        set -euo pipefail
        cd kernel_workspace/common/out/arch/arm64/boot
        BASE=https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.14.0
        curl -fL "$BASE/kptools-linux" -o kptools-linux
        curl -fL "$BASE/kpimg" -o kpimg
        echo 'a6b912ca964d35427d7fbcd87273abac604970e9746fa0613362be971f07259d  kptools-linux' | sha256sum -c -
        echo 'ab020f31ca1c058603917e46d8a6691fbce0dd5cdc135a9cd8dc780e89472716  kpimg' | sha256sum -c -
        chmod +x kptools-linux
        cp Image Image.before-kpm
        ./kptools-linux -p -i Image -k kpimg -o Image.with-kpm
        test -s Image.with-kpm
        if cmp -s Image.before-kpm Image.with-kpm; then echo KPM_IMAGE_UNCHANGED; exit 1; fi
        sha256sum Image.before-kpm Image.with-kpm
        mv Image.with-kpm Image
    - name: 克隆 AnyKernel3 并打包
      id: create_zip
      run: |
        set -euo pipefail
        cd kernel_workspace
        git clone https://github.com/cctv18/AnyKernel3 AnyKernel3
        git -C AnyKernel3 checkout --detach 091ee586e1a5d5c1c1c957d48fe7c61638d04dc4
        test "$(git -C AnyKernel3 rev-parse HEAD)" = "091ee586e1a5d5c1c1c957d48fe7c61638d04dc4"
        cd AnyKernel3
        cp ../common/out/arch/arm64/boot/Image Image
        test -s Image
        sed -i 's/^do.devicecheck=.*/do.devicecheck=1/; s/^device.name1=.*/device.name1=OP5D0DL1/; s/^device.name2=.*/device.name2=OP5D55L1/; s/^device.name3=.*/device.name3=PJZ110/' anykernel.sh
        test ! -e kpn.zip
        cp ../common/out/.config kernel.config
        cat > build-info.txt <<'EOF'
        Device: OnePlus 13 / PJZ110 / SM8750
        Kernel: 6.6.118-android15-8-g93e223c276e7-abogki500782043-4k
        Kernel source commit: 2a4726b11594dd57d0779d2685fad5c81e5ed553
        Root: official SukiSU builtin; manager target v4.3.0-r2 (41150); SUSFS inline hooks; built into Image
        SukiSU source commit: 1cfa57340590971cba7521ed536da8ebbedc5f0a
        SukiSU version identity: v4.3.0-r2-1cfa5734@builtin-susfs
        Manager package: com.sukisu.ultra
        Manager certificate SHA256: 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
        KPM: CONFIG_KPM=y; official SukiSU KernelPatch 0.14.0 ABI v2; no KPatch-Next/KPN module
        HMBIRD/FengChi: enabled
        O2: enabled
        ADIOS: enabled
        SUSFS: v2.3.0; cctv18/susfs4oki commit 70ef05071dfc423da158543a79e6cbc805809345; enabled and compiled into Image; priority UID filter hook included
        LZ4/zstd optional patch: skipped because the repository patch does not match the pinned 6.6.118 source tree
        Root branch change: official builtin/SUSFS_INLINE_HOOK, not the earlier main/Tracepoint build; no BakaSU
        Kernel suffix follows screenshot; compiled Image is custom, not the original OEM image
        Phone runtime/boot verification: not performed
        EOF
        sha256sum Image > Image.sha256
        AK3_NAME=AK3_OnePlus13_6.6.118_SukiSU_41150_SUSFS_2.3.0_KPM.zip
        zip -r "../$AK3_NAME" Image Image.sha256 kernel.config build-info.txt LICENSE META-INF anykernel.sh tools
        zip -z "../$AK3_NAME" < build-info.txt
        echo "ak3name=$AK3_NAME" >> "$GITHUB_OUTPUT"
    - name: 上传 Ccache 调试日志
      if: always() && false
      uses: actions/upload-artifact@v4
      with:
        name: ccache-debug-log
        path: ${{ github.workspace }}/kernel_workspace/ccache.log
    - name: 上传 ZIP 工件
      uses: actions/upload-artifact@v4
      with:
        name: OP13-6.6.118-SukiSU-SUSFS-2.3.0-KPM
        if-no-files-found: error
        path: ${{ github.workspace }}/kernel_workspace/${{ steps.create_zip.outputs.ak3name }}

